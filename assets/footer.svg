<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120" role="img" aria-label="Thanks for visiting">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="0.5" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <clipPath id="card">
      <rect width="1000" height="120" rx="18"/>
    </clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .wave-a { animation: slide 16s linear infinite; }
    .wave-b { animation: slide 26s linear infinite reverse; }
    @keyframes slide {
      from { transform: translateX(0); }
      to   { transform: translateX(-1000px); }
    }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 0.75; }
      50%      { opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="120" fill="url(#bg)"/>
    <g class="wave-b">
      <path fill="#a78bfa" fill-opacity="0.18" d="M0 26 Q 125 4 250 26 T 500 26 T 750 26 T 1000 26 T 1250 26 T 1500 26 T 1750 26 T 2000 26 V 0 H 0 Z"/>
    </g>
    <g class="wave-a">
      <path fill="#22d3ee" fill-opacity="0.16" d="M0 40 Q 125 66 250 40 T 500 40 T 750 40 T 1000 40 T 1250 40 T 1500 40 T 1750 40 T 2000 40 V 0 H 0 Z"/>
    </g>
    <text class="pulse" x="500" y="88" text-anchor="middle" font-size="20" fill="#e0f2fe">Thanks for stopping by. Let's build something together!</text>
  </g>
</svg>
